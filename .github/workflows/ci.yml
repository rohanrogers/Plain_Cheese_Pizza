name: Brightloop verification
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-audit:
    name: Security & Secret Leak Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-repository-secrets.py
  code-quality-and-style:
    name: Code Quality & Style Formatting (Python & JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install ruff==0.11.13
      - run: ruff check backend --select E9,F63,F7,F82
      - run: npm ci --ignore-scripts --no-audit
      - run: npx --no-install prettier --check frontend/app.js frontend/identity.js frontend/catalog.js frontend/configuration.js frontend/index.html frontend/style.css
  backend-test-and-verify:
    name: Backend & IAM Verification (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop
          POSTGRES_DB: brightloop
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://brightloop:brightloop@localhost:5432/brightloop
      LOCAL_MAILBOX: "true"
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest backend.tests.test_finance backend.tests.test_iam backend.tests.test_modules_2_3_5 backend.tests.test_regressions backend.tests.test_completion -v
  frontend-verify:
    name: Main frontend syntax and integration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: python3 -m unittest backend.tests.test_frontend_contract -v
  containerized-build:
    name: Integrated container build and startup
    runs-on: ubuntu-latest
    needs: [security-audit, code-quality-and-style, backend-test-and-verify, frontend-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cryptography python-dotenv
      - run: python -m backend.configure_local
      - run: docker compose --profile app up -d --build --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:3000/api/health
          test "$(docker compose exec -T app whoami)" != root
      - if: always()
        run: docker compose --profile app logs && docker compose --profile app down -v
  ci-gate:
    name: CI Gate — All Checks Passed
    runs-on: ubuntu-latest
    needs: [security-audit, code-quality-and-style, backend-test-and-verify, frontend-verify, containerized-build]
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          assert all(job['result']=='success' for job in results.values()), results
          PY
