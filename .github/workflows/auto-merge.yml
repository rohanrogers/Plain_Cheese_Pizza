name: Auto Merge Verified PRs

on:
  workflow_run:
    workflows: ["Brightloop Integrated IAM & Finance CI/CD Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge PR on CI Success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Automatically merge verified PR to main
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "🚀 All CI verification checks passed! Merging PR #$PR_NUMBER into main..."
            gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --delete-branch
          else
            echo "No pull request associated with this workflow run."
          fi
